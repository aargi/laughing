<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Palette 02 · Violet Pulse</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
</style>
</helmet>
<div style="{{rootStyle}}">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 48px; height: 176px; box-sizing: border-box; padding: 40px 48px 32px">
<div style="display: flex; flex-direction: column; gap: 10px">
<span class="mono" style="{{labelStyle}}">{{number}}</span>
<h1 style="margin: 0; font-size: 44px; font-weight: 600; letter-spacing: -0.03em; line-height: 1">{{name}}</h1>
</div>
<div style="display: flex; flex-direction: column; gap: 12px; max-width: 620px; align-items: flex-end">
<p style="{{descStyle}}">{{desc}}</p>
<div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end">
<sc-for list="{{tags}}" as="t" hint-placeholder-count="4">
<span style="{{t.style}}">{{t.label}}</span>
</sc-for>
</div>
</div>
</div>
<div style="display: flex; height: 724px">
<sc-for list="{{swatches}}" as="s" hint-placeholder-count="9">
<div style="{{s.style}}">
<span style="{{s.roleStyle}}">{{s.role}}</span>
<span style="font-size: 22px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.15">{{s.name}}</span>
<span class="mono" style="font-size: 20px; font-weight: 500">{{s.hex}}</span>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var P = {
      number: 'OPTION 02',
      name: 'Violet Pulse',
      desc: 'Ultraviolet as the signature and electric cyan for AI: the most AI-forward option. Energetic and digital, grounded by a plum-black ink.',
      tags: ['AI-forward', 'Energetic', 'Digital', 'Modern'],
      colors: [
        ['Primary / Ink', 'Plum Black', '#17121F', 1.2],
        ['Brand accent', 'Ultraviolet', '#6C3BFF', 1.5],
        ['AI accent', 'Electric Cyan', '#22D3EE', 1.5],
        ['Attention / Planned', 'Flamingo', '#FF5C8A', 1.1],
        ['Success', 'Mint', '#2CC48A', 1.1],
        ['Main background', 'Lavender Mist', '#F6F4FB', 1],
        ['Card', 'White', '#FFFFFF', 1],
        ['Secondary text', 'Grey Violet', '#69647E', 0.9],
        ['Border', 'Haze', '#E3DFEE', 0.9]
      ]
    };
    return build(P);
    function lum(hex) {
      var c = [1, 3, 5].map(function (i) { var v = parseInt(hex.substr(i, 2), 16) / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
      return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
    }
    function build(P) {
      var ink = P.colors[0][2], bg = P.colors[5][2], muted = P.colors[7][2], border = P.colors[8][2];
      var swatches = P.colors.map(function (c, i) {
        var dark = lum(c[2]) < 0.28;
        var fg = dark ? '#FFFFFF' : ink;
        var edge = (c[2] === '#FFFFFF' || lum(c[2]) > 0.85) ? 'box-shadow:inset 1px 0 0 ' + border + ',inset -1px 0 0 ' + border + ';' : '';
        return {
          role: c[0], name: c[1], hex: c[2],
          style: 'flex:' + c[3] + ' 1 0;min-width:0;box-sizing:border-box;padding:28px 22px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;background:' + c[2] + ';color:' + fg + ';' + edge,
          roleStyle: 'font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:' + (dark ? '0.78' : '0.7')
        };
      });
      return {
        number: P.number, name: P.name, desc: P.desc, swatches: swatches,
        tags: P.tags.map(function (t) { return { label: t, style: 'display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:99px;font-size:13px;font-weight:500;background:#FFFFFF;border:1px solid ' + border + ';color:' + ink }; }),
        rootStyle: 'width:1440px;height:900px;overflow:hidden;display:flex;flex-direction:column;background:' + bg + ';color:' + ink + ';font-family:Geist,system-ui,sans-serif',
        labelStyle: 'font-size:13px;font-weight:600;letter-spacing:.1em;color:' + muted,
        descStyle: 'margin:0;font-size:16px;line-height:1.5;text-align:right;color:' + muted
      };
    }
  }
}
</script>
</body>
</html>
